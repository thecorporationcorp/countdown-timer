<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b2735;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#090a0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cccc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.3"/>

  <!-- Timer circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="440 880" transform="rotate(-90 256 256)"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#00ffff"/>

  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#00ffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="320" y2="256" stroke="#00ffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Quantum particles -->
  <circle cx="180" cy="180" r="4" fill="#00ffff" opacity="0.8"/>
  <circle cx="332" cy="180" r="4" fill="#00ffff" opacity="0.8"/>
  <circle cx="180" cy="332" r="4" fill="#00ffff" opacity="0.8"/>
  <circle cx="332" cy="332" r="4" fill="#00ffff" opacity="0.8"/>

  <!-- Inner glow -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.2"/>
</svg>
